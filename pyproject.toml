[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epma-thins"
version = "0.1.0.dev0"
description = "Thin-film and multilayer quantification for electron probe microanalysis (EPMA)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Austin Fox", email = "openafox@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "xraylib>=4.1",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/openafox/epma_thins"

[tool.hatch.build.targets.wheel]
packages = ["src/epma_thins"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
